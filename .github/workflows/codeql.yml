name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # CodeQL ships new queries faster than this code changes, so the same commit
  # is worth re-scanning even when nothing has landed.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

# A new push to a PR makes the in-flight run pointless.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      # Filing the results in the Security tab is the point of the job.
      security-events: write
      # `analyze` reads the run it is part of to attach results to the commit.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The client and the proxy are both plain ES modules — there is nothing
      # to compile ahead of the scan, so CodeQL reads the source as it stands
      # rather than watching a build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
